# A gemnek nincs teszt-suite-ja, ezért az ellenőrzés négy dolgot néz:
# minden forrás szintaktikailag helyes-e, felépül-e a gem, betölthető-e
# a függőségeivel együtt, és 100%-ban dokumentált-e RDoc szerint.
#
# Kiadás: verzióemelés a bbs.gemspec-ben, majd egy vX.Y.Z tag. A tag
# pipeline-ja ellenőrzi, hogy a tag a gemspec verzióját hirdeti, és
# feltölti az RDoc-ot a Gitea generic registrybe (engines/bbs-rdoc), ahonnan
# a wiki-fetcher a wiki.teletypegames.org/rdoc/bbs/ alá teszi.
#
# Szükséges secret: gitea_token (globális) — package:write az engines orgban.
steps:
  - name: test
    image: ruby:3.2-slim
    commands:
      - ruby -v
      - echo "==> Syntax check"
      - |
        for f in $(find lib -name '*.rb'); do ruby -c "$f" >/dev/null || exit 1; done
        echo "$(find lib -name '*.rb' | wc -l) fajl rendben"
      - echo "==> Gem build"
      - gem build bbs.gemspec
      - echo "==> Load check"
      - gem install --no-document ./bbs-*.gem
      - ruby -e 'require "bbs"; puts "BBS betoltve, " + BBS.constants.size.to_s + " konstans"'

  # A dokumentáció a kód része: 100% alatt elbukik (CLAUDE.md).
  - name: rdoc-coverage
    image: ruby:3.3-slim
    commands:
      - gem install --no-document rdoc -v 8.1.0
      - rdoc -C lib | tee coverage.txt
      - grep -q '100.00% documented' coverage.txt

  - name: tag-matches-version
    image: ruby:3.3-slim
    commands:
      - V="$(ruby -e 'puts Gem::Specification.load("bbs.gemspec").version')"
      - test "$CI_COMMIT_TAG" = "v$$V" || { echo "a tag ($CI_COMMIT_TAG) nem a gemspec verzioja (v$$V)"; exit 1; }
    when:
      - event: tag

  - name: publish-rdoc
    image: ruby:3.3-slim
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - gem install --no-document rdoc -v 8.1.0
      - V="$(ruby -e 'puts Gem::Specification.load("bbs.gemspec").version')"
      - rdoc -q -o doc --main README.md --title "bbs $$V" lib README.md
      - COV="$(rdoc -C lib | sed -nE 's/^ *([0-9.]+)% documented.*/\1/p')"
      - |
        ruby -rjson -e 'puts JSON.generate(gem: "bbs", version: ARGV[0], commit: ARGV[1], date: Time.now.utc.strftime("%F"), coverage: ARGV[2].to_f)' "$$V" "$CI_COMMIT_SHA" "$$COV" > doc/meta.json
      - tar -czf rdoc.tar.gz -C doc .
      - |
        ruby -rnet/http -e '
          uri = URI("https://git.teletypegames.org/api/packages/engines/generic/bbs-rdoc/#{ARGV[0]}/rdoc.tar.gz")
          req = Net::HTTP::Put.new(uri, "Authorization" => "token #{ENV.fetch("GITEA_TOKEN").strip}")
          req.body = File.binread("rdoc.tar.gz")
          res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
          puts "#{res.code} #{uri}"
          exit(res.is_a?(Net::HTTPSuccess) ? 0 : 1)' "$$V"
    when:
      - event: tag
