# Az ellenőrzés: minden forrás szintaktikailag helyes-e, felépül-e a gem,
# betölthető-e a függőségeivel együtt, zöld-e a minitest-suite (rake test),
# tiszta-e a rubocop, és 100%-ban dokumentált-e RDoc szerint.
#
# Kiadás: verzióemelés a rubbs.gemspec-ben, majd egy vX.Y.Z tag. A tag
# pipeline-ja ellenőrzi, hogy a tag a gemspec verzióját hirdeti, és
# feltölti az RDoc-ot a Gitea generic registrybe (engines/rubbs-rdoc), ahonnan
# a wiki-fetcher a wiki.teletypegames.org/rdoc/rubbs/ alá teszi.
#
# Szükséges secret: gitea_token (globális) — package:write az engines orgban.
steps:
  - name: test
    image: ruby:3.2-slim
    commands:
      - ruby -v
      - echo "==> Syntax check"
      - |
        for f in $(find lib -name '*.rb'); do ruby -c "$f" >/dev/null || exit 1; done
        echo "$(find lib -name '*.rb' | wc -l) fajl rendben"
      - echo "==> Gem build"
      - gem build rubbs.gemspec
      - echo "==> Load check"
      - gem install --no-document ./rubbs-*.gem
      - ruby -e 'require "rubbs"; puts "Rubbs betoltve: " + [Rubbs::Common, Rubbs::Modern, Rubbs::Petscii].map { |m| m.constants.size }.sum.to_s + " konstans"'

  # A minitest-suite: a biztonsági és stabilitási korlátok és a közös
  # blokkok (Text, SQLite, Store, HTTP, Cache, RateLimit) tesztjei.
  - name: unit-tests
    # nem slim: a fejlesztői gemek egy része natív kiterjesztést fordít
    image: ruby:3.3
    commands:
      - bundle install
      - bundle exec rake test

  # A mintaboard (examples/sample-bbs) ennek a checkoutnak a rubbs-ával: a
  # tesztjei és a rake bbs:check. Egy board szemével nézi a kiadás előtt a
  # DSL-t, a modelleket és a check-szabályokat.
  - name: sample-bbs
    image: ruby:3.3
    commands:
      - cd examples/sample-bbs
      - bundle install
      - bundle exec rake

  # Az egész gem a .rubocop.yml szabályaihoz igazodik, todo-fájl nélkül.
  - name: rubocop
    image: ruby:3.3
    commands:
      - bundle install
      - bundle exec rubocop

  # A dokumentáció a kód része: 100% alatt elbukik (CLAUDE.md).
  - name: rdoc-coverage
    # nem slim: az rdoc 8 rbs-függősége natív kiterjesztést fordít
    image: ruby:3.3
    commands:
      - gem install --no-document rdoc -v 8.1.0
      - rdoc -C lib | tee coverage.txt
      - grep -q '100.00% documented' coverage.txt

  - name: tag-matches-version
    image: ruby:3.3-slim
    commands:
      - V="$(ruby -e 'puts Gem::Specification.load("rubbs.gemspec").version')"
      - test "$CI_COMMIT_TAG" = "v$$V" || { echo "a tag ($CI_COMMIT_TAG) nem a gemspec verzioja (v$$V)"; exit 1; }
    when:
      - event: tag

  - name: publish-rdoc
    image: ruby:3.3
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - gem install --no-document rdoc -v 8.1.0
      - V="$(ruby -e 'puts Gem::Specification.load("rubbs.gemspec").version')"
      - rdoc -q -o doc --main README.md --title "rubbs $$V" lib README.md
      - COV="$(rdoc -C lib | sed -nE 's/^ *([0-9.]+)% documented.*/\1/p')"
      - |
        ruby -rjson -e 'puts JSON.generate(gem: "rubbs", version: ARGV[0], commit: ARGV[1], date: Time.now.utc.strftime("%F"), coverage: ARGV[2].to_f)' "$$V" "$CI_COMMIT_SHA" "$$COV" > doc/meta.json
      - tar -czf rdoc.tar.gz -C doc .
      - |
        ruby -rnet/http -e '
          uri = URI("https://git.teletypegames.org/api/packages/engines/generic/rubbs-rdoc/#{ARGV[0]}/rdoc.tar.gz")
          req = Net::HTTP::Put.new(uri, "Authorization" => "token #{ENV.fetch("GITEA_TOKEN").strip}", "Content-Type" => "application/octet-stream")
          req.body = File.binread("rdoc.tar.gz")
          res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
          puts "#{res.code} #{uri}"
          exit(res.is_a?(Net::HTTPSuccess) ? 0 : 1)' "$$V"
    when:
      - event: tag
