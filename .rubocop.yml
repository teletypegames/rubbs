AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "doc/**/*"

# The layout is the formatter's: `rubocop -a` puts every file in this shape.
# What fits on a line (130) goes on one line; a call, a definition or a
# hash that does not gets one argument (key, parameter) a line, the closing
# bracket on a line of its own, and its keys lined up as a table.
Layout/LineLength:
  Max: 130
  AutoCorrect: false
Layout/RedundantLineBreak:
  Enabled: true
Layout/FirstMethodArgumentLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/FirstMethodParameterLineBreak:
  Enabled: true
Layout/MultilineMethodParameterLineBreaks:
  Enabled: true
Layout/FirstHashElementLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/MultilineHashKeyLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent
Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table
Layout/ExtraSpacing:
  AllowForAlignment: true

# Key tables (`when :x then …; :keep`) read best on one line.
Style/BlockDelimiters:
  Enabled: false
Style/SingleLineDoEndBlock:
  Enabled: false
Style/Semicolon:
  AllowAsExpressionSeparator: true
# `x rescue nil` for a best-effort close or write, and `if … then … else
# … end` on one line in the telnet state machines.
Style/RescueModifier:
  Enabled: false
Style/OneLineConditional:
  Enabled: false
Style/RescueStandardError:
  EnforcedStyle: explicit
Style/FetchEnvVar:
  Enabled: false
# The documentation is RDoc, checked at 100% by `rdoc -C lib` in CI.
Style/Documentation:
  Enabled: false

# Small methods.
Metrics/MethodLength:
  Max: 15
  CountAsOne: [array, hash, heredoc, method_call]
  Exclude:
    - "test/**/*"
# Options are keyword arguments with defaults, documented one by one.
Metrics/ParameterLists:
  CountKeywordArgs: false
Metrics/AbcSize:
  Max: 20
  Exclude:
    - "test/**/*"
Metrics/CyclomaticComplexity:
  Exclude:
    - "test/**/*"
Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "bbs.gemspec"
# Data (a table, a list, a heredoc) counts as one line: a preset is not code.
Metrics/ClassLength:
  Max: 120
  CountAsOne: [array, hash, heredoc, method_call]
  Exclude:
    - "test/**/*"
Metrics/ModuleLength:
  CountAsOne: [array, hash, heredoc, method_call]

# BBS::Cache#fetch takes a block, not a default.
Style/RedundantFetchBlock:
  Exclude:
    - "test/**/*"

# Short names (x, y, w, h, ch) are the idiom of the drawing code.
Naming/MethodParameterName:
  MinNameLength: 1

# The gem is installed from git, not pushed to rubygems.org.
Gemspec/RequireMFA:
  Enabled: false
